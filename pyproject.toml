[project]
name = "arm64-rag-bench"
version = "0.1.0"
description = "Local RAG and reproducible Arm64 inference benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
arm64-rag = "arm64_rag.cli:main"

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arm64_rag"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1"]
build = ["cmake>=3.28,<5", "ninja>=1.11,<2"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor", "build", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
